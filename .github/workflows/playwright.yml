name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm install

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium

    - name: Install Playwright System Dependencies
      run: npx playwright install-deps chromium

    - name: Clean Allure results
      run: npm run clean:allure

    - name: Run Playwright tests
      # Added 'blob' reporter here to ensure merging works
      run: xvfb-run npm run test:demo -- --shard=${{ matrix.shard }}/4 --reporter=blob,line --retries=2
      env:
        BASE_URL: "https://www.saucedemo.com/"
        USER_NAME: ${{ secrets.USER_NAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
        PRODUCTPAGE_URL: "https://www.saucedemo.com/inventory.html"

    - name: Upload Blob Report (for merging)
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: all-blob-reports-${{ matrix.shard }}
        path: blob-report
        retention-days: 1

    - name: Upload Allure Results (for merging)
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results-${{ matrix.shard }}
        path: allure-results
        retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # FIX 1: You MUST set up Java here for Allure to work
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm install

    - name: Download all Blob Reports
      uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        pattern: all-blob-reports-*
        merge-multiple: true

    - name: Download all Allure Results
      uses: actions/download-artifact@v4
      with:
        path: allure-results
        pattern: allure-results-*
        merge-multiple: true

    # FIX 2: Ensure the directory exists before merging
    - name: Merge Playwright HTML Report
      run: npx playwright merge-reports --reporter html ./all-blob-reports

    # FIX 3: Use 'npx allure' to ensure the binary is pulled correctly
    - name: Generate Combined Allure Report
      run: npx allure generate allure-results --clean -o allure-report

    - name: Upload Final Playwright Report
      uses: actions/upload-artifact@v4
      with:
        name: final-playwright-report
        path: playwright-report
        retention-days: 30

    - name: Upload Final Allure Report
      uses: actions/upload-artifact@v4
      with:
        name: final-allure-report
        path: allure-report
        retention-days: 30