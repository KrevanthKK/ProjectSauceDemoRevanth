name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Clean Allure results
      run: npm run clean:allure

    - name: Run Playwright tests
      run: xvfb-run npm run test:demo_cr_he -- --shard=${{ matrix.shard }}/4 --reporter=blob,line --retries=2
      env:
        BASE_URL: "https://www.saucedemo.com/"
        USER_NAME: ${{ secrets.USER_NAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
        PRODUCTPAGE_URL: "https://www.saucedemo.com/inventory.html"

    - name: Upload Blob Report (for merging)
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: all-blob-reports-${{ matrix.shard }}
        path: blob-report
        retention-days: 1

    - name: Upload Allure Results (for merging)
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results-${{ matrix.shard }}
        path: allure-results
        retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm install

    - name: Download all Blob Reports
      uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        pattern: all-blob-reports-*
        merge-multiple: true

    - name: Download all Allure Results
      uses: actions/download-artifact@v4
      with:
        path: allure-results
        pattern: allure-results-*
        merge-multiple: true

    - name: Merge Playwright HTML Report
      run: npx playwright merge-reports --reporter html ./all-blob-reports

    - name: Generate Combined Allure Report
      run: npx allure-commandline generate allure-results --clean -o allure-report

    - name: Upload Final Playwright Report
      uses: actions/upload-artifact@v4
      with:
        name: final-playwright-report
        path: playwright-report
        retention-days: 30

    - name: Upload Final Allure Report
      uses: actions/upload-artifact@v4
      with:
        name: final-allure-report
        path: allure-report
        retention-days: 30
