name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# SETUP: Add GitHub Secrets (Settings → Secrets and variables → Actions)
# - USER_NAME: test username
# - PASSWORD: test password
# Ref: https://docs.github.com/en/actions/security-guides/using-secrets-in-github-actions

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
        total-shards: [3]
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: rm -rf allure-results
      
      - name: Run tests - Shard ${{ matrix.shard }}/3
        run: npm test -- --shard=${{ matrix.shard }}/3
        env:
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.shard }}
          path: |
            playwright-report/
            blob-report/
            allure-results/
          retention-days: 1
          if-no-files-found: ignore

  merge-reports:
    name: Merge & Upload Reports
    if: always()
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - run: npm ci
      - run: npm install -g allure-commandline
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: reports-*
      
      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html ./all-reports
      
      - name: Merge Allure reports
        run: |
          mkdir -p merged-allure-results
          for dir in all-reports/reports-*/allure-results; do
            [ -d "$dir" ] && cp -r "$dir"/* merged-allure-results/ || true
          done
          allure generate merged-allure-results --clean -o allure-report || true
      
      - name: Upload final reports
        uses: actions/upload-artifact@v4
        with:
          name: final-reports
          path: |
            playwright-report/
            allure-report/
          retention-days: 30
