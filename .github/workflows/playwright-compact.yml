name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# SETUP: Add GitHub Secrets (Settings → Secrets and variables → Actions)
# - USER_NAME: test username
# - PASSWORD: test password
# Ref: https://docs.github.com/en/actions/security-guides/using-secrets-in-github-actions

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
        total-shards: [3]
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - run: npm ci
      
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm list @playwright/test --depth=0 | grep @playwright/test | awk -F@ '{print $NF}')" >> $GITHUB_OUTPUT
      
      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}
      
      - name: Install Playwright Browsers with dependencies
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      
      - name: Install system dependencies only (if cache hit)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      
      - run: rm -rf allure-results blob-report playwright-report
      
      - name: Run tests - Shard ${{ matrix.shard }}/3
        run: npm test -- --shard=${{ matrix.shard }}/3
        env:
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
      
      - name: List artifacts before upload
        if: always()
        run: |
          echo "=== Checking artifacts to upload ==="
          ls -lah playwright-report/ 2>/dev/null | head -5 || echo "No playwright-report"
          ls -lah blob-report/ 2>/dev/null | head -5 || echo "No blob-report"
          ls -lah allure-results/ 2>/dev/null | head -5 || echo "No allure-results"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.shard }}
          path: |
            playwright-report/
            blob-report/
            allure-results/
          retention-days: 1
          if-no-files-found: ignore
        timeout-minutes: 10

  merge-reports:
    name: Merge & Upload Reports
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci

      # ─── Install Allure CLI directly from GitHub releases ────────────────────
      # This is more reliable than allure-commandline npm package in CI.
      # Java is bundled with ubuntu-latest; Allure just needs the binary on PATH.
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.27.0
          curl -sL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            -o allure.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH
          echo "✓ Allure CLI ${ALLURE_VERSION} installed"

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: reports-*
          merge-multiple: false

      - name: Show downloaded artifact structure
        run: |
          echo "=== Downloaded artifact structure ==="
          find all-reports -type f | sort

      # ─── Merge Playwright HTML report from all shards ────────────────────────
      - name: Merge Playwright blob reports
        run: |
          set +e
          mkdir -p blob-reports-merged playwright-report

          # Playwright 1.45+ uses .zip blob files; older versions use .jsonl
          find all-reports -path "*/blob-report/*" \( -name "*.zip" -o -name "*.jsonl" \) \
            -exec cp {} blob-reports-merged/ \;

          BLOB_COUNT=$(find blob-reports-merged -type f | wc -l)
          echo "Found $BLOB_COUNT blob report files across shards"

          if [ "$BLOB_COUNT" -gt 0 ]; then
            npx playwright merge-reports --reporter html blob-reports-merged
            echo "✓ Playwright HTML report merged ($(find playwright-report -type f | wc -l) files)"
          else
            echo "⚠ No blob files found — empty playwright-report created"
          fi

      # ─── Merge Allure results from all shards ────────────────────────────────
      - name: Merge Allure results
        run: |
          set +e
          mkdir -p merged-allure-results allure-report

          echo "=== Collecting Allure results ==="
          for dir in all-reports/reports-*/allure-results; do
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              FILE_COUNT=$(find "$dir" -type f | wc -l)
              echo "  ✓ $dir  → $FILE_COUNT files"
              rsync -a "$dir"/ merged-allure-results/
            else
              echo "  ⚠ Skipping (empty): $dir"
            fi
          done

          TOTAL=$(find merged-allure-results -type f | wc -l)
          echo "Total Allure result files collected: $TOTAL"

          if [ "$TOTAL" -gt 0 ]; then
            echo "=== Generating Allure HTML report ==="
            allure generate merged-allure-results --clean -o allure-report
            echo "✓ Allure report generated: $(find allure-report -type f | wc -l) files"
          else
            echo "⚠ No Allure results to merge"
          fi

      # ─── Upload final merged reports ─────────────────────────────────────────
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Report Summary
        if: always()
        run: |
          set +e
          echo "==================================="
          echo "       CI/CD Report Summary        "
          echo "==================================="
          echo "Playwright report : $(find playwright-report -type f 2>/dev/null | wc -l) files"
          echo "Allure report     : $(find allure-report     -type f 2>/dev/null | wc -l) files"
          echo "Artifacts         : playwright-html-report, allure-html-report"
          echo "==================================="

