name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# SETUP: Add GitHub Secrets (Settings → Secrets and variables → Actions)
# - USER_NAME: test username
# - PASSWORD: test password
# Ref: https://docs.github.com/en/actions/security-guides/using-secrets-in-github-actions

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
        total-shards: [3]
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - run: npm ci
      
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm list @playwright/test --depth=0 | grep @playwright/test | awk -F@ '{print $NF}')" >> $GITHUB_OUTPUT
      
      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-${{ runner.os }}
      
      - name: Install Playwright Browsers with dependencies
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      
      - name: Install system dependencies only (if cache hit)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      
      - run: rm -rf allure-results blob-report playwright-report
      
      - name: Run tests - Shard ${{ matrix.shard }}/3
        run: npm test -- --shard=${{ matrix.shard }}/3
        env:
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
      
      - name: List artifacts before upload
        if: always()
        run: |
          echo "=== Checking artifacts to upload ==="
          ls -lah playwright-report/ 2>/dev/null | head -5 || echo "No playwright-report"
          ls -lah blob-report/ 2>/dev/null | head -5 || echo "No blob-report"
          ls -lah allure-results/ 2>/dev/null | head -5 || echo "No allure-results"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.shard }}
          path: |
            playwright-report/
            blob-report/
            allure-results/
          retention-days: 1
          if-no-files-found: ignore
        timeout-minutes: 10

  merge-reports:
    name: Merge & Upload Reports
    if: always()
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - run: npm ci
      
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: reports-*
          merge-multiple: false

      - name: Debug downloaded structure
        run: |
          echo "=== Full artifact structure ==="
          find all-reports -type f | sort
      
      - name: Merge Playwright blob reports
        run: |
          echo "=== Collecting blob report files ==="
          mkdir -p blob-reports-merged

          # Playwright blob reporter outputs .zip files in newer versions, .jsonl in older
          find all-reports -path "*/blob-report/*" \( -name "*.zip" -o -name "*.jsonl" \) \
            -exec cp {} blob-reports-merged/ \; || true

          BLOB_COUNT=$(find blob-reports-merged -type f | wc -l)
          echo "Found $BLOB_COUNT blob report files"

          if [ "$BLOB_COUNT" -gt 0 ]; then
            echo "Merging Playwright HTML report from all shards..."
            npx playwright merge-reports --reporter html blob-reports-merged
            echo "✓ Playwright HTML report merged"
          else
            echo "⚠ No blob reports found — creating empty placeholder"
            mkdir -p playwright-report
          fi
        continue-on-error: true

      - name: Merge Allure results and generate report
        run: |
          echo "=== Collecting Allure results from all shards ==="
          mkdir -p merged-allure-results

          SHARD_COUNT=0
          for dir in all-reports/reports-*/allure-results; do
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "✓ Processing shard: $dir"
              find "$dir" -type f -exec cp -n {} merged-allure-results/ \; || true
              ((SHARD_COUNT++))
            else
              echo "⚠ Skipping empty/missing: $dir"
            fi
          done

          RESULT_COUNT=$(find merged-allure-results -type f | wc -l)
          echo "Total merged Allure result files: $RESULT_COUNT from $SHARD_COUNT shards"

          if [ "$RESULT_COUNT" -gt 0 ]; then
            echo "Generating Allure HTML report..."
            ./node_modules/.bin/allure generate merged-allure-results --clean -o allure-report
            echo "✓ Allure report generated: $(find allure-report -type f | wc -l) files"
          else
            echo "⚠ No Allure results to merge — skipping report generation"
            mkdir -p allure-report
          fi
        continue-on-error: true

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload merged Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Report Summary
        if: always()
        run: |
          echo "=== CI/CD Report Summary ==="
          echo "Playwright report files : $(find playwright-report -type f 2>/dev/null | wc -l)"
          echo "Allure report files     : $(find allure-report -type f 2>/dev/null | wc -l)"
          echo "Artifacts uploaded      : playwright-html-report, allure-html-report"

