name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# SETUP: Add GitHub Secrets (Settings → Secrets and variables → Actions)
# - USER_NAME: test username
# - PASSWORD: test password
# Ref: https://docs.github.com/en/actions/security-guides/using-secrets-in-github-actions

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
        total-shards: [3]
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: rm -rf allure-results
      
      - name: Run tests - Shard ${{ matrix.shard }}/3
        run: npm test -- --shard=${{ matrix.shard }}/3
        env:
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.shard }}
          path: |
            playwright-report/
            blob-report/
            allure-results/
          retention-days: 1
          if-no-files-found: ignore

  merge-reports:
    name: Merge & Upload Reports
    if: always()
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - run: npm ci
      - run: npm install -g allure-commandline
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: reports-*
      
      - name: Flatten blob reports
        run: |
          echo "=== Checking downloaded artifacts ==="
          ls -la all-reports/ || true
          find all-reports -type f -name "*.jsonl" 2>/dev/null | head -20
          
          echo "=== Flattening blob reports ==="
          mkdir -p blob-reports-merged
          find all-reports -name "*.jsonl" -path "*/blob-report/*" -exec cp {} blob-reports-merged/ \; || true
          
          echo "=== Flattened reports ==="
          ls -la blob-reports-merged/ 2>/dev/null | tail -5
          echo "Total blob report files: $(find blob-reports-merged -name "*.jsonl" | wc -l)"
      
      - name: Merge Playwright reports
        run: |
          BLOB_COUNT=$(find blob-reports-merged -name "*.jsonl" 2>/dev/null | wc -l)
          echo "Found $BLOB_COUNT blob report files from 3 shards"
          
          if [ "$BLOB_COUNT" -gt 0 ]; then
            echo "Merging Playwright reports..."
            npx playwright merge-reports --reporter html blob-reports-merged
            echo "✓ Playwright merge completed"
          else
            echo "No blob reports found, creating empty report"
            mkdir -p playwright-report
          fi
        continue-on-error: true
      
      - name: Merge Allure reports
        run: |
          echo "=== Merging Allure reports from 3 shards ==="
          mkdir -p merged-allure-results
          
          SHARD_COUNT=0
          for dir in all-reports/reports-*/allure-results; do
            if [ -d "$dir" ]; then
              echo "Processing: $dir"
              cp -r "$dir"/* merged-allure-results/ || true
              ((SHARD_COUNT++))
            fi
          done
          
          echo "✓ Merged $SHARD_COUNT shards"
          echo "Generating Allure report..."
          allure generate merged-allure-results --clean -o allure-report || true
          echo "✓ Allure report generated"
      
      - name: Upload final reports
        uses: actions/upload-artifact@v4
        with:
          name: final-reports
          path: |
            playwright-report/
            allure-report/
          retention-days: 30
      
      - name: Report Summary
        run: |
          echo "=== CI/CD Report Summary ==="
          echo "✓ Tests ran on 3 shards"
          echo "✓ Playwright reports merged: $(find playwright-report -type f 2>/dev/null | wc -l) files"
          echo "✓ Allure reports merged: $(find allure-report -type f 2>/dev/null | wc -l) files"
          echo "✓ Final reports uploaded as: final-reports"
