name: Update Visual Snapshots

# Manually triggered from GitHub Actions UI
# Go to: Actions → Update Visual Snapshots → Run workflow
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update snapshots on'
        required: true
        default: 'main'

jobs:
  update-snapshots:
    name: Regenerate Linux Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Run tests with --update-snapshots (generates Linux baselines)
        run: npx playwright test --update-snapshots --project=chromium
        env:
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        continue-on-error: true

      - name: Show generated snapshots
        run: |
          echo "=== Snapshots generated/updated ==="
          find snapshots -name "*linux*" -type f | sort

      - name: Commit and push updated snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "ci: update Linux visual snapshots [skip ci]"
            git push origin ${{ github.event.inputs.branch }}
            echo "✓ Snapshots committed and pushed"
          fi
